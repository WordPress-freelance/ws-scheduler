<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <style>.lora { font-family: 'Lora', Georgia, serif; }</style>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C5CBF"/>
      <stop offset="1" stop-color="#5A3F95"/>
    </linearGradient>
  </defs>

  <!-- Browser background -->
  <rect width="1200" height="900" fill="#FAFAF8"/>

  <!-- Browser chrome -->
  <rect x="0" y="0" width="1200" height="48" fill="#E5E1D9"/>
  <circle cx="22" cy="24" r="6" fill="#FF6B5A"/>
  <circle cx="42" cy="24" r="6" fill="#FFC53D"/>
  <circle cx="62" cy="24" r="6" fill="#5FD49C"/>
  <rect x="140" y="13" width="600" height="22" rx="11" fill="#fff" stroke="#D4D0C8"/>
  <text x="156" y="28" fill="#7A7670" font-size="11">https://monsite.fr/contact</text>

  <!-- Site header -->
  <rect x="0" y="48" width="1200" height="80" fill="#fff"/>
  <text class="lora" x="80" y="100" fill="#222" font-size="22" font-weight="600">Mon Site SEO</text>
  <text x="700" y="100" fill="#666" font-size="14">Accueil</text>
  <text x="780" y="100" fill="#666" font-size="14">À propos</text>
  <text x="880" y="100" fill="#666" font-size="14">Services</text>
  <text x="980" y="100" fill="#222" font-size="14" font-weight="600">Contact</text>

  <line x1="0" y1="128" x2="1200" y2="128" stroke="#E8E5DE"/>

  <!-- Hero section -->
  <text class="lora" x="80" y="220" fill="#222" font-size="48" font-weight="600">Travaillons ensemble</text>
  <text x="80" y="266" fill="#666" font-size="18">Réservez un créneau de 30 minutes pour discuter</text>
  <text x="80" y="294" fill="#666" font-size="18">de votre projet — sans engagement.</text>

  <!-- THE BOOKING BUTTON -->
  <g transform="translate(80, 340)">
    <rect width="280" height="60" rx="12" fill="url(#g1)"/>
    <g transform="translate(28, 18)" stroke="#F0EDE8" fill="none" stroke-width="1.6">
      <rect width="20" height="20" rx="3"/>
      <line x1="0" y1="6" x2="20" y2="6"/>
      <line x1="6" y1="-2" x2="6" y2="3"/>
      <line x1="14" y1="-2" x2="14" y2="3"/>
    </g>
    <text x="140" y="38" fill="#F0EDE8" font-size="17" font-weight="600" text-anchor="middle">Réserver un créneau</text>
  </g>

  <!-- Annotation pointing at the button -->
  <g transform="translate(400, 360)">
    <path d="M0 18 Q 30 18 60 0" stroke="#7C5CBF" stroke-width="2" fill="none" stroke-dasharray="4 3"/>
    <polygon points="0,18 -8,14 -6,22" fill="#7C5CBF"/>
    <text x="76" y="-4" fill="#7C5CBF" font-size="14" font-weight="600">Shortcode [ws_booking_button]</text>
    <text x="76" y="14" fill="#9590A8" font-size="12">ou classe CSS .ws-book-btn</text>
    <text x="76" y="30" fill="#9590A8" font-size="12">sur n'importe quel bouton de page builder</text>
  </g>

  <!-- Trust elements -->
  <g transform="translate(80, 480)">
    <circle cx="10" cy="10" r="10" fill="#5FD49C"/>
    <path d="M5 10 l3 3 l7 -7" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="30" y="14" fill="#444" font-size="14">Confirmation immédiate par email</text>

    <circle cx="10" cy="46" r="10" fill="#5FD49C"/>
    <path d="M5 46 l3 3 l7 -7" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="30" y="50" fill="#444" font-size="14">Disponibilités en temps réel</text>

    <circle cx="10" cy="82" r="10" fill="#5FD49C"/>
    <path d="M5 82 l3 3 l7 -7" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="30" y="86" fill="#444" font-size="14">Données stockées sur votre serveur — aucun service tiers</text>
  </g>

  <!-- Footer (light gray) -->
  <rect x="0" y="800" width="1200" height="100" fill="#222"/>
  <text x="80" y="850" fill="#888" font-size="12">© 2026 Mon Site SEO. Tous droits réservés.</text>
  <text x="1120" y="850" fill="#888" font-size="12" text-anchor="end">Mentions légales · Confidentialité</text>
</svg>
