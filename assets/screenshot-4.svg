<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <style>.lora { font-family: 'Lora', Georgia, serif; }</style>
  </defs>
  <!-- WP admin background (clear theme) -->
  <rect width="1200" height="900" fill="#F0F0F1"/>

  <!-- WP top bar -->
  <rect x="0" y="0" width="1200" height="32" fill="#1d2327"/>
  <text x="20" y="20" fill="#fff" font-size="12">monsite.fr</text>

  <!-- WP sidebar -->
  <rect x="0" y="32" width="160" height="868" fill="#1d2327"/>
  <text x="22" y="68" fill="#a7aaad" font-size="12">Tableau de bord</text>
  <text x="22" y="92" fill="#a7aaad" font-size="12">Articles</text>
  <text x="22" y="116" fill="#a7aaad" font-size="12">Médias</text>
  <text x="22" y="140" fill="#a7aaad" font-size="12">Pages</text>
  <rect x="0" y="156" width="160" height="34" fill="#2271b1"/>
  <text x="22" y="178" fill="#fff" font-size="12" font-weight="600">Extensions</text>
  <text x="22" y="208" fill="#a7aaad" font-size="12">Comptes</text>
  <text x="22" y="232" fill="#a7aaad" font-size="12">Outils</text>
  <text x="22" y="256" fill="#a7aaad" font-size="12">Réglages</text>
  <text x="22" y="288" fill="#a7aaad" font-size="12">WS Scheduler</text>

  <!-- Main content -->
  <text x="200" y="80" fill="#1d2327" font-size="24" font-weight="400">Extensions <tspan font-size="14" fill="#646970">Ajouter</tspan></text>

  <!-- Tabs -->
  <text x="200" y="124" fill="#2271b1" font-size="14" font-weight="600">Toutes <tspan fill="#646970" font-weight="400">(8)</tspan></text>
  <text x="290" y="124" fill="#646970" font-size="14">| Activées (8)</text>
  <text x="400" y="124" fill="#646970" font-size="14">| Désactivées (0)</text>
  <text x="530" y="124" fill="#646970" font-size="14">| Mises à jour disponibles (1)</text>

  <line x1="200" y1="142" x2="1180" y2="142" stroke="#c3c4c7"/>

  <!-- Bulk actions bar -->
  <g transform="translate(200, 162)">
    <rect width="160" height="32" rx="3" fill="#fff" stroke="#8c8f94"/>
    <text x="14" y="20" fill="#1d2327" font-size="13">Actions groupées ▾</text>
    <rect x="168" width="60" height="32" rx="3" fill="#f6f7f7" stroke="#dcdcde"/>
    <text x="198" y="20" fill="#1d2327" font-size="13" text-anchor="middle">Valider</text>
  </g>

  <!-- Table header -->
  <rect x="200" y="216" width="980" height="40" fill="#fff" stroke="#c3c4c7"/>
  <text x="220" y="241" fill="#2c3338" font-size="13" font-weight="600">Extension</text>
  <text x="700" y="241" fill="#2c3338" font-size="13" font-weight="600">Description</text>
  <text x="1100" y="241" fill="#2c3338" font-size="13" font-weight="600">Mise à jour</text>

  <!-- WS Scheduler row (highlighted - this is what we want to showcase) -->
  <rect x="200" y="256" width="980" height="120" fill="#fff" stroke="#c3c4c7"/>
  <rect x="200" y="256" width="4" height="120" fill="#7C5CBF"/>

  <g transform="translate(220, 276)">
    <text fill="#2271b1" font-size="14" font-weight="700">WS Scheduler</text>
    <text x="0" y="22" fill="#1d2327" font-size="13">Désactiver | </text>
    <text x="76" y="22" fill="#2271b1" font-size="13" font-weight="500">Réglages</text>
    <text x="146" y="22" fill="#1d2327" font-size="13"> | </text>
    <text x="164" y="22" fill="#7C5CBF" font-size="13" font-weight="600">Version Pro ↗</text>

    <text x="480" y="0" fill="#1d2327" font-size="13" font-weight="500">Système de prise de rendez-vous complet avec popup</text>
    <text x="480" y="18" fill="#1d2327" font-size="13" font-weight="500">calendrier, formulaire et emails automatiques.</text>
    <text x="480" y="46" fill="#646970" font-size="12">Version 4.0.4 | Par WebStrategy | Voir les détails | Site web</text>
  </g>

  <!-- Other plugins (less detailed) -->
  <rect x="200" y="376" width="980" height="80" fill="#fff" stroke="#c3c4c7"/>
  <g transform="translate(220, 396)">
    <text fill="#2271b1" font-size="14" font-weight="700">Akismet Anti-Spam</text>
    <text x="0" y="22" fill="#1d2327" font-size="13">Désactiver | Réglages</text>
    <text x="480" y="0" fill="#1d2327" font-size="13">Used by millions, Akismet is the best way to protect…</text>
    <text x="480" y="22" fill="#646970" font-size="12">Version 5.3.4 | Par Automattic | Voir les détails</text>
  </g>

  <rect x="200" y="456" width="980" height="80" fill="#fff" stroke="#c3c4c7"/>
  <g transform="translate(220, 476)">
    <text fill="#2271b1" font-size="14" font-weight="700">Yoast SEO</text>
    <text x="0" y="22" fill="#1d2327" font-size="13">Désactiver | Premium | Réglages | Aide</text>
    <text x="480" y="0" fill="#1d2327" font-size="13">The first true all-in-one SEO solution for WordPress…</text>
    <text x="480" y="22" fill="#646970" font-size="12">Version 22.7 | Par Team Yoast | Voir les détails</text>
  </g>

  <rect x="200" y="536" width="980" height="80" fill="#fff" stroke="#c3c4c7"/>
  <g transform="translate(220, 556)">
    <text fill="#2271b1" font-size="14" font-weight="700">LiteSpeed Cache</text>
    <text x="0" y="22" fill="#1d2327" font-size="13">Désactiver | Réglages</text>
    <text x="480" y="0" fill="#1d2327" font-size="13">High-performance page caching and site optimization…</text>
    <text x="480" y="22" fill="#646970" font-size="12">Version 6.4 | Par LiteSpeed Technologies</text>
  </g>

  <!-- Highlight callout pointing at the Pro version link -->
  <g transform="translate(440, 290)">
    <rect width="280" height="78" rx="10" fill="#FFFBE5" stroke="#DBA111" stroke-width="1.5"/>
    <text x="14" y="22" fill="#996B00" font-size="11" font-weight="700" letter-spacing="1.2">NOUVEAU EN 4.0.2</text>
    <text x="14" y="44" fill="#1d2327" font-size="12" font-weight="500">Lien direct vers la version Pro depuis</text>
    <text x="14" y="60" fill="#1d2327" font-size="12" font-weight="500">la liste des extensions WordPress.</text>
    <!-- Arrow pointing left to the pro link -->
    <path d="M-12 28 L0 24 L-2 28 L0 32 Z" fill="#DBA111"/>
  </g>
</svg>
