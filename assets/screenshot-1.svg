    <line x1="0" y1="78" x2="976" y2="78" stroke="#2E2B38"/>
    <g transform="translate(24, 96)" fill="#9590A8" font-size="10" letter-spacing="1.2">
      <text x="0">DATE</text>
      <text x="120">HEURE</text>
      <text x="200">CLIENT</text>
      <text x="380">EMAIL</text>
      <text x="600">MESSAGE</text>
      <text x="760">STATUT</text>
    </g>
    <line x1="0" y1="110" x2="976" y2="110" stroke="#2E2B38"/>

    <g font-size="13">
      <g transform="translate(24, 132)">
        <text fill="#F0EDE8">12 juin 2026</text>
        <text x="120" fill="#A899D4">10:00</text>
        <text x="200" fill="#F0EDE8" font-weight="500">Sophie Martin</text>
        <text x="380" fill="#9590A8">sophie@acme.io</text>
        <text x="600" fill="#9590A8">Démo produit Q3…</text>
        <rect x="760" y="-14" width="86" height="22" rx="11" fill="#1B3A2A" stroke="#2D6B4A"/>
        <text x="803" y="2" fill="#5FD49C" font-size="11" text-anchor="middle">Confirmé</text>
      </g>
      <line x1="24" y1="150" x2="952" y2="150" stroke="#2E2B38" stroke-dasharray="2 4" opacity="0.5"/>

      <g transform="translate(24, 178)">
        <text fill="#F0EDE8">12 juin 2026</text>
        <text x="120" fill="#A899D4">14:30</text>
        <text x="200" fill="#F0EDE8" font-weight="500">Léo Dubois</text>
        <text x="380" fill="#9590A8">leo.dubois@gmail.com</text>
        <text x="600" fill="#9590A8">Audit SEO site e-com…</text>
        <rect x="760" y="-14" width="86" height="22" rx="11" fill="#3A2D14" stroke="#6B5429"/>
        <text x="803" y="2" fill="#FFB94A" font-size="11" text-anchor="middle">En attente</text>
      </g>
      <line x1="24" y1="196" x2="952" y2="196" stroke="#2E2B38" stroke-dasharray="2 4" opacity="0.5"/>

      <g transform="translate(24, 224)">
        <text fill="#F0EDE8">13 juin 2026</text>
        <text x="120" fill="#A899D4">09:00</text>
        <text x="200" fill="#F0EDE8" font-weight="500">Marie Lefèvre</text>
        <text x="380" fill="#9590A8">m.lefevre@studio.fr</text>
        <text x="600" fill="#9590A8">—</text>
        <rect x="760" y="-14" width="86" height="22" rx="11" fill="#1B3A2A" stroke="#2D6B4A"/>
        <text x="803" y="2" fill="#5FD49C" font-size="11" text-anchor="middle">Confirmé</text>
      </g>
    </g>
  </g>

  <!-- Install help card -->
  <g transform="translate(200, 572)">
    <rect width="976" height="304" rx="12" fill="#1A1724" stroke="#2E2B38"/>

    <!-- Summary line -->
    <circle cx="44" cy="40" r="11" fill="none" stroke="#A899D4" stroke-width="1.6"/>
    <path d="M40 36 a3 3 0 0 1 6 1 c0 2 -3 2 -3 3" stroke="#A899D4" stroke-width="1.6" fill="none"/>
    <circle cx="44" cy="45" r="1.2" fill="#A899D4"/>
    <text class="lora" x="64" y="46" fill="#F0EDE8" font-size="17" font-weight="600">Comment afficher le bouton de réservation sur votre site</text>
    <text x="952" y="46" fill="#9590A8" font-size="11" text-anchor="end">cliquer pour replier</text>

    <!-- Méthode 1 -->
    <g transform="translate(24, 70)">
      <rect width="446" height="216" rx="10" fill="#221D32" stroke="#2E2B38"/>
      <rect x="14" y="14" width="80" height="22" rx="11" fill="#7C5CBF"/>
      <text x="54" y="29" fill="#F0EDE8" font-size="11" font-weight="600" text-anchor="middle">MÉTHODE 1</text>
      <text x="104" y="30" fill="#F0EDE8" font-size="14" font-weight="500">Shortcode</text>

      <text x="14" y="64" fill="#C4BFDA" font-size="12">Collez ce shortcode dans n'importe quelle page,</text>
      <text x="14" y="80" fill="#C4BFDA" font-size="12">article ou widget texte :</text>

      <rect x="14" y="92" width="418" height="34" rx="6" fill="#0E0C15" stroke="#2E2B38"/>
      <text x="28" y="114" fill="#A899D4" font-size="13" font-family="Courier New, monospace">[ws_booking_button]</text>

      <text x="14" y="148" fill="#9590A8" font-size="11">Pour personnaliser le libellé du bouton :</text>
      <rect x="14" y="158" width="418" height="34" rx="6" fill="#0E0C15" stroke="#2E2B38"/>
      <text x="28" y="180" fill="#A899D4" font-size="12" font-family="Courier New, monospace">[ws_booking_button label="Réserver"]</text>
    </g>

    <!-- Méthode 2 -->
    <g transform="translate(494, 70)">
      <rect width="446" height="216" rx="10" fill="#221D32" stroke="#2E2B38"/>
      <rect x="14" y="14" width="80" height="22" rx="11" fill="#7C5CBF"/>
      <text x="54" y="29" fill="#F0EDE8" font-size="11" font-weight="600" text-anchor="middle">MÉTHODE 2</text>
      <text x="104" y="30" fill="#F0EDE8" font-size="14" font-weight="500">Classe CSS sur bouton existant</text>

      <text x="14" y="64" fill="#C4BFDA" font-size="12">Pratique pour Avada, Elementor, Divi :</text>
      <text x="14" y="80" fill="#C4BFDA" font-size="12">ajoutez la classe CSS</text>

      <rect x="184" y="68" width="78" height="20" rx="3" fill="#0E0C15" stroke="#2E2B38"/>
      <text x="195" y="82" fill="#A899D4" font-size="11" font-family="Courier New, monospace">ws-book-btn</text>

      <text x="14" y="116" fill="#C4BFDA" font-size="12">à n'importe quel bouton existant. Le clic</text>
      <text x="14" y="132" fill="#C4BFDA" font-size="12">ouvrira la popup automatiquement.</text>

      <text x="14" y="164" fill="#9590A8" font-size="11">Exemple dans le champ « Classe CSS » :</text>
      <rect x="14" y="174" width="200" height="32" rx="6" fill="#0E0C15" stroke="#2E2B38"/>
      <text x="28" y="194" fill="#A899D4" font-size="13" font-family="Courier New, monospace">ws-book-btn</text>
    </g>
