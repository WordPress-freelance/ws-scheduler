  <text x="22" y="68" fill="#fff" font-size="12" font-weight="500">WS Scheduler</text>
  <text x="22" y="100" fill="#a7aaad" font-size="11">Tableau de bord</text>
  <text x="22" y="124" fill="#a7aaad" font-size="11">Indisponibilités</text>
  <text x="22" y="148" fill="#a7aaad" font-size="11">Réglages</text>

  <!-- Plugin top bar -->
  <rect x="160" y="0" width="1040" height="60" fill="#1A1724"/>
  <rect x="184" y="16" width="28" height="28" rx="6" fill="#7C5CBF"/>
  <text x="194" y="36" fill="#F0EDE8" font-size="14" font-weight="700">W</text>
  <text x="222" y="36" fill="#F0EDE8" font-size="13" font-weight="600">WebStrategy</text>
  <rect x="360" y="22" width="118" height="28" rx="14" fill="#221D32" stroke="#7C5CBF"/>
  <text x="382" y="40" fill="#F0EDE8" font-size="11" font-weight="500">Tableau de bord</text>
  <text x="500" y="40" fill="#9590A8" font-size="11">Indisponibilités</text>
  <text x="612" y="40" fill="#9590A8" font-size="11">Réglages</text>
  <text x="1170" y="40" fill="#4A4260" font-size="10" text-anchor="end">monsite.fr</text>

  <!-- Page title -->
  <text class="lora" x="200" y="110" fill="#F0EDE8" font-size="28" font-weight="600">Tableau de bord</text>
  <text x="200" y="132" fill="#9590A8" font-size="13">Rendez-vous · vue d'ensemble</text>

  <!-- Stats grid -->
  <g>
    <rect x="200" y="156" width="232" height="84" rx="12" fill="#1A1724" stroke="#2E2B38"/>
    <text x="220" y="180" fill="#9590A8" font-size="11" letter-spacing="1.2">À VENIR</text>
    <text class="lora" x="220" y="220" fill="#A899D4" font-size="36" font-weight="600">14</text>

    <rect x="448" y="156" width="232" height="84" rx="12" fill="#1A1724" stroke="#2E2B38"/>
    <text x="468" y="180" fill="#9590A8" font-size="11" letter-spacing="1.2">CONFIRMÉS</text>
    <text class="lora" x="468" y="220" fill="#F0EDE8" font-size="36" font-weight="600">11</text>

    <rect x="696" y="156" width="232" height="84" rx="12" fill="#1A1724" stroke="#2E2B38"/>
    <text x="716" y="180" fill="#9590A8" font-size="11" letter-spacing="1.2">EN ATTENTE</text>
    <text class="lora" x="716" y="220" fill="#FFB94A" font-size="36" font-weight="600">3</text>

    <rect x="944" y="156" width="232" height="84" rx="12" fill="#1A1724" stroke="#2E2B38"/>
    <text x="964" y="180" fill="#9590A8" font-size="11" letter-spacing="1.2">ANNULÉS</text>
    <text class="lora" x="964" y="220" fill="#4A4260" font-size="36" font-weight="600">2</text>
  </g>

  <!-- RDV table (compacted) -->
  <g transform="translate(200, 260)">
    <rect width="976" height="290" rx="12" fill="#1A1724" stroke="#2E2B38"/>

    <g transform="translate(24, 24)">
      <rect width="80" height="30" rx="15" fill="url(#g1)"/>
      <text x="40" y="19" fill="#F0EDE8" font-size="12" font-weight="500" text-anchor="middle">Tous</text>
      <rect x="92" width="100" height="30" rx="15" fill="#221D32" stroke="#2E2B38"/>
      <text x="142" y="19" fill="#C4BFDA" font-size="12" text-anchor="middle">Confirmés</text>
      <rect x="204" width="100" height="30" rx="15" fill="#221D32" stroke="#2E2B38"/>
      <text x="254" y="19" fill="#C4BFDA" font-size="12" text-anchor="middle">En attente</text>
      <rect x="316" width="84" height="30" rx="15" fill="#221D32" stroke="#2E2B38"/>
      <text x="358" y="19" fill="#C4BFDA" font-size="12" text-anchor="middle">Annulés</text>
