<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <style>.lora { font-family: 'Lora', Georgia, serif; }</style>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C5CBF"/>
      <stop offset="1" stop-color="#5A3F95"/>
    </linearGradient>
  </defs>

  <!-- Email client background (light) -->
  <rect width="1200" height="900" fill="#F5F4F2"/>

  <!-- Email client chrome (Gmail-like) -->
  <rect x="0" y="0" width="1200" height="56" fill="#fff" stroke="#E0DDD6"/>
  <text x="32" y="35" fill="#222" font-size="16" font-weight="600">Boîte de réception</text>
  <text x="1160" y="35" fill="#666" font-size="12" text-anchor="end">1 sur 142</text>

  <!-- Email subject bar -->
  <rect x="0" y="56" width="1200" height="64" fill="#FAFAF8"/>
  <text x="32" y="84" fill="#222" font-size="18" font-weight="600">[Mon Site SEO] Confirmation de rendez-vous — 12/06/2026 à 10:00</text>
  <g transform="translate(32, 96)" fill="#666" font-size="12">
    <text>de <tspan fill="#222" font-weight="500">Mon Site SEO &lt;contact@monsite.fr&gt;</tspan></text>
    <text x="380">à <tspan fill="#222" font-weight="500">sophie@example.com</tspan></text>
    <text x="600">12 juin 2026, 09:32</text>
  </g>

  <!-- Email viewport (centered, 600px wide) -->
  <rect x="300" y="140" width="600" height="744" fill="#0E0C15"/>

  <!-- Email content -->
  <g transform="translate(300, 140)">

    <!-- Header band -->
    <rect width="600" height="100" fill="#1A1724"/>
    <rect x="32" y="32" width="36" height="36" rx="8" fill="#7C5CBF"/>
    <text x="50" y="56" fill="#F0EDE8" font-size="18" font-weight="700" text-anchor="middle">W</text>
    <text class="lora" x="84" y="58" fill="#F0EDE8" font-size="18" font-weight="600">Mon Site SEO</text>

    <!-- Body -->
    <rect y="100" width="600" height="624" fill="#14121C"/>

    <text class="lora" x="32" y="156" fill="#F0EDE8" font-size="22" font-weight="600">Bonjour Sophie Martin,</text>

    <text x="32" y="196" fill="#C4BFDA" font-size="14">Votre rendez-vous a bien été enregistré.</text>
    <text x="32" y="216" fill="#C4BFDA" font-size="14">Voici le récapitulatif :</text>

    <!-- Detail rows -->
    <g transform="translate(32, 252)">
      <rect width="536" height="48" rx="6" fill="#1A1724"/>
      <text x="20" y="29" fill="#9590A8" font-size="12">Date</text>
      <text x="516" y="29" fill="#A899D4" font-size="14" font-weight="500" text-anchor="end">Vendredi 12 juin 2026</text>
    </g>
    <g transform="translate(32, 308)">
      <rect width="536" height="48" rx="6" fill="#1A1724"/>
      <text x="20" y="29" fill="#9590A8" font-size="12">Heure</text>
      <text x="516" y="29" fill="#A899D4" font-size="14" font-weight="500" text-anchor="end">10:00</text>
    </g>
    <g transform="translate(32, 364)">
      <rect width="536" height="48" rx="6" fill="#1A1724"/>
      <text x="20" y="29" fill="#9590A8" font-size="12">Durée</text>
      <text x="516" y="29" fill="#A899D4" font-size="14" font-weight="500" text-anchor="end">30 minutes</text>
    </g>
    <g transform="translate(32, 420)">
      <rect width="536" height="48" rx="6" fill="#1A1724"/>
      <text x="20" y="29" fill="#9590A8" font-size="12">Google Meet</text>
      <text x="516" y="29" fill="#A899D4" font-size="13" font-weight="500" text-anchor="end" text-decoration="underline">meet.google.com/abc-defg-hij</text>
    </g>

    <text x="32" y="500" fill="#C4BFDA" font-size="13">En cas d'empêchement, vous pouvez nous joindre par retour</text>
    <text x="32" y="518" fill="#C4BFDA" font-size="13">de cet email pour annuler ou reprogrammer.</text>

    <text x="32" y="558" fill="#C4BFDA" font-size="14" font-weight="500">À très bientôt,</text>
    <text class="lora" x="32" y="582" fill="#F0EDE8" font-size="16" font-weight="600">L'équipe Mon Site SEO</text>

    <!-- Footer -->
    <rect y="724" width="600" height="20" fill="#1A1724"/>
    <text x="300" y="738" fill="#6E6888" font-size="10" text-anchor="middle">Email automatique — merci de ne pas y répondre directement</text>
  </g>

  <!-- Annotation -->
  <g transform="translate(60, 460)">
    <text class="lora" fill="#7C5CBF" font-size="16" font-weight="600">Email HTML responsive</text>
    <text y="22" fill="#666" font-size="12">Design dark theme cohérent</text>
    <text y="40" fill="#666" font-size="12">avec votre back-office.</text>
    <text y="76" fill="#7C5CBF" font-size="12" font-weight="500">✓ Inline CSS</text>
    <text y="96" fill="#7C5CBF" font-size="12" font-weight="500">✓ Compatible tous clients</text>
    <text y="116" fill="#7C5CBF" font-size="12" font-weight="500">✓ Logo personnalisable (Pro)</text>
    <text y="136" fill="#7C5CBF" font-size="12" font-weight="500">✓ Couleurs personnalisables (Pro)</text>
  </g>
</svg>
