<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <style>.lora { font-family: 'Lora', Georgia, serif; }</style>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C5CBF"/>
      <stop offset="1" stop-color="#5A3F95"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="#14121C"/>

  <!-- WP sidebar -->
  <rect x="0" y="0" width="160" height="900" fill="#1d2327"/>
  <rect x="0" y="80" width="160" height="34" fill="#2271b1"/>
  <text x="22" y="68" fill="#a7aaad" font-size="11">Tableau de bord</text>
  <text x="22" y="102" fill="#fff" font-size="12" font-weight="500">Indisponibilités</text>
  <text x="22" y="124" fill="#a7aaad" font-size="11">Réglages</text>
  <text x="22" y="146" fill="#a7aaad" font-size="11">Licence Pro</text>

  <!-- Plugin top bar -->
  <rect x="160" y="0" width="1040" height="60" fill="#1A1724"/>
  <rect x="184" y="16" width="28" height="28" rx="6" fill="#7C5CBF"/>
  <text x="194" y="36" fill="#F0EDE8" font-size="14" font-weight="700">W</text>
  <text x="222" y="36" fill="#F0EDE8" font-size="13" font-weight="600">WebStrategy</text>
  <text x="360" y="40" fill="#9590A8" font-size="11">Tableau de bord</text>
  <rect x="478" y="22" width="118" height="28" rx="14" fill="#221D32" stroke="#7C5CBF"/>
  <text x="500" y="40" fill="#F0EDE8" font-size="11" font-weight="500">Indisponibilités</text>
  <text x="612" y="40" fill="#9590A8" font-size="11">Réglages</text>
  <text x="688" y="40" fill="#9590A8" font-size="11">Licence Pro</text>

  <!-- Title -->
  <text class="lora" x="200" y="118" fill="#F0EDE8" font-size="28" font-weight="600">Indisponibilités</text>
  <text x="200" y="142" fill="#9590A8" font-size="13">Bloquez les créneaux où vous n'êtes pas disponible.</text>

  <!-- Form card -->
  <g transform="translate(200, 174)">
    <rect width="600" height="640" rx="12" fill="#1A1724" stroke="#2E2B38"/>

    <text x="24" y="40" fill="#F0EDE8" font-size="14" font-weight="600">Ajouter une indisponibilité</text>

    <!-- Mode tabs -->
    <text x="24" y="80" fill="#9590A8" font-size="11" letter-spacing="1.2">MODE</text>

    <rect x="24" y="92" width="170" height="58" rx="10" fill="#221D32" stroke="#7C5CBF" stroke-width="1.5"/>
    <circle cx="44" cy="112" r="4" fill="#7C5CBF"/>
    <text x="60" y="116" fill="#F0EDE8" font-size="13" font-weight="500">Période complète</text>
    <text x="60" y="134" fill="#9590A8" font-size="11">Vacances, fériés</text>

    <rect x="206" y="92" width="170" height="58" rx="10" fill="#221D32" stroke="#2E2B38"/>
    <circle cx="226" cy="112" r="4" fill="#4A4260" stroke="#9590A8"/>
    <text x="242" y="116" fill="#C4BFDA" font-size="13" font-weight="500">Créneau ponctuel</text>
    <text x="242" y="134" fill="#9590A8" font-size="11">Un jour, plage horaire</text>

    <rect x="388" y="92" width="188" height="58" rx="10" fill="#221D32" stroke="#2E2B38"/>
    <circle cx="408" cy="112" r="4" fill="#4A4260" stroke="#9590A8"/>
    <text x="424" y="116" fill="#C4BFDA" font-size="13" font-weight="500">Récurrent hebdo</text>
    <text x="424" y="134" fill="#9590A8" font-size="11">Tous les lundis 12-14h</text>

    <!-- Form fields -->
    <text x="24" y="194" fill="#9590A8" font-size="11" letter-spacing="1.2">LIBELLÉ</text>
    <rect x="24" y="206" width="552" height="42" rx="8" fill="#0E0C15" stroke="#2E2B38"/>
    <text x="40" y="232" fill="#F0EDE8" font-size="13">Vacances d'été</text>

    <text x="24" y="280" fill="#9590A8" font-size="11" letter-spacing="1.2">DATE DE DÉBUT</text>
    <rect x="24" y="292" width="266" height="42" rx="8" fill="#0E0C15" stroke="#2E2B38"/>
    <text x="40" y="318" fill="#F0EDE8" font-size="13">15/07/2026</text>
    <g transform="translate(258, 308)" stroke="#9B8EC4" fill="none">
      <rect width="14" height="14" rx="2"/>
      <line x1="0" y1="5" x2="14" y2="5"/>
      <line x1="4" y1="0" x2="4" y2="3"/>
      <line x1="10" y1="0" x2="10" y2="3"/>
    </g>

    <text x="310" y="280" fill="#9590A8" font-size="11" letter-spacing="1.2">DATE DE FIN</text>
    <rect x="310" y="292" width="266" height="42" rx="8" fill="#0E0C15" stroke="#2E2B38"/>
    <text x="326" y="318" fill="#F0EDE8" font-size="13">31/08/2026</text>
    <g transform="translate(544, 308)" stroke="#9B8EC4" fill="none">
      <rect width="14" height="14" rx="2"/>
      <line x1="0" y1="5" x2="14" y2="5"/>
      <line x1="4" y1="0" x2="4" y2="3"/>
      <line x1="10" y1="0" x2="10" y2="3"/>
    </g>

    <!-- Submit -->
    <rect x="24" y="380" width="180" height="44" rx="10" fill="url(#g1)"/>
    <text x="114" y="408" fill="#F0EDE8" font-size="13" font-weight="600" text-anchor="middle">Ajouter</text>

    <!-- Tip box -->
    <rect x="24" y="446" width="552" height="78" rx="10" fill="#221D32" stroke="#4A4260" stroke-dasharray="3 3"/>
    <circle cx="44" cy="466" r="9" fill="none" stroke="#9B8EC4"/>
    <text x="44" y="471" fill="#9B8EC4" font-size="11" text-anchor="middle">i</text>
    <text x="64" y="471" fill="#C4BFDA" font-size="12" font-weight="500">Astuce</text>
    <text x="64" y="494" fill="#9590A8" font-size="11">Pour une pause déjeuner tous les jours,</text>
    <text x="64" y="510" fill="#9590A8" font-size="11">utilisez le mode « Récurrent hebdo » avec</text>
    <text x="64" y="526" fill="#9590A8" font-size="11">les 7 jours sélectionnés et 12:00 → 14:00.</text>
  </g>

  <!-- Right: list of existing unavailabilities -->
  <g transform="translate(816, 174)">
    <rect width="360" height="640" rx="12" fill="#1A1724" stroke="#2E2B38"/>
    <text x="24" y="40" fill="#F0EDE8" font-size="14" font-weight="600">En cours (4)</text>

    <!-- Item 1 -->
    <g transform="translate(24, 64)">
      <rect width="312" height="84" rx="10" fill="#221D32" stroke="#2E2B38"/>
      <rect x="14" y="14" width="78" height="20" rx="10" fill="#2A1F3A"/>
      <text x="53" y="28" fill="#A899D4" font-size="10" font-weight="500" text-anchor="middle">PÉRIODE</text>
      <text x="14" y="56" fill="#F0EDE8" font-size="13" font-weight="500">Vacances d'été</text>
      <text x="14" y="74" fill="#9590A8" font-size="11">15 juil. → 31 août 2026</text>
      <g transform="translate(284, 14)" stroke="#9590A8" fill="none">
        <line x1="0" y1="0" x2="12" y2="12"/>
        <line x1="12" y1="0" x2="0" y2="12"/>
      </g>
    </g>

    <!-- Item 2 -->
    <g transform="translate(24, 162)">
      <rect width="312" height="84" rx="10" fill="#221D32" stroke="#2E2B38"/>
      <rect x="14" y="14" width="78" height="20" rx="10" fill="#1F2A3A"/>
      <text x="53" y="28" fill="#7C9BD9" font-size="10" font-weight="500" text-anchor="middle">PONCTUEL</text>
      <text x="14" y="56" fill="#F0EDE8" font-size="13" font-weight="500">Conférence Paris</text>
      <text x="14" y="74" fill="#9590A8" font-size="11">22 juin · 14:00 → 18:00</text>
      <g transform="translate(284, 14)" stroke="#9590A8" fill="none">
        <line x1="0" y1="0" x2="12" y2="12"/>
        <line x1="12" y1="0" x2="0" y2="12"/>
      </g>
    </g>

    <!-- Item 3 -->
    <g transform="translate(24, 260)">
      <rect width="312" height="84" rx="10" fill="#221D32" stroke="#2E2B38"/>
      <rect x="14" y="14" width="86" height="20" rx="10" fill="#2A1F3A"/>
      <text x="57" y="28" fill="#A899D4" font-size="10" font-weight="500" text-anchor="middle">RÉCURRENT</text>
      <text x="14" y="56" fill="#F0EDE8" font-size="13" font-weight="500">Pause déjeuner</text>
      <text x="14" y="74" fill="#9590A8" font-size="11">L · M · M · J · V — 12:00 → 14:00</text>
      <g transform="translate(284, 14)" stroke="#9590A8" fill="none">
        <line x1="0" y1="0" x2="12" y2="12"/>
        <line x1="12" y1="0" x2="0" y2="12"/>
      </g>
    </g>

    <!-- Item 4 -->
    <g transform="translate(24, 358)">
      <rect width="312" height="84" rx="10" fill="#221D32" stroke="#2E2B38"/>
      <rect x="14" y="14" width="86" height="20" rx="10" fill="#2A1F3A"/>
      <text x="57" y="28" fill="#A899D4" font-size="10" font-weight="500" text-anchor="middle">RÉCURRENT</text>
      <text x="14" y="56" fill="#F0EDE8" font-size="13" font-weight="500">Coaching mensuel</text>
      <text x="14" y="74" fill="#9590A8" font-size="11">Vendredi — 16:00 → 18:00</text>
      <g transform="translate(284, 14)" stroke="#9590A8" fill="none">
        <line x1="0" y1="0" x2="12" y2="12"/>
        <line x1="12" y1="0" x2="0" y2="12"/>
      </g>
    </g>
  </g>
</svg>
