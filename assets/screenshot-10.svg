<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <style>.lora { font-family: 'Lora', Georgia, serif; }</style>
  </defs>

  <rect width="1200" height="900" fill="#F5F4F2"/>

  <rect x="0" y="0" width="1200" height="56" fill="#fff" stroke="#E0DDD6"/>
  <text x="32" y="35" fill="#222" font-size="16" font-weight="600">Boîte de réception · Admin</text>

  <rect x="0" y="56" width="1200" height="64" fill="#FAFAF8"/>
  <text x="32" y="84" fill="#222" font-size="18" font-weight="600">[Mon Site SEO] Nouveau rendez-vous — Sophie Martin · 12/06/2026 10:00</text>
  <g transform="translate(32, 96)" fill="#666" font-size="12">
    <text>de <tspan fill="#222" font-weight="500">WordPress &lt;wordpress@monsite.fr&gt;</tspan></text>
    <text x="380">à <tspan fill="#222" font-weight="500">contact@monsite.fr</tspan></text>
    <text x="600">12 juin 2026, 09:32</text>
  </g>

  <!-- Email viewport -->
  <rect x="300" y="140" width="600" height="744" fill="#0E0C15"/>

  <g transform="translate(300, 140)">
    <rect width="600" height="100" fill="#1A1724"/>
    <rect x="32" y="32" width="36" height="36" rx="8" fill="#7C5CBF"/>
    <text x="50" y="56" fill="#F0EDE8" font-size="18" font-weight="700" text-anchor="middle">W</text>
    <text class="lora" x="84" y="58" fill="#F0EDE8" font-size="18" font-weight="600">Mon Site SEO</text>
    <rect x="480" y="32" width="88" height="24" rx="12" fill="#221D32" stroke="#7C5CBF"/>
    <text x="524" y="48" fill="#A899D4" font-size="11" font-weight="500" text-anchor="middle">ADMIN</text>

    <rect y="100" width="600" height="624" fill="#14121C"/>

    <text class="lora" x="32" y="156" fill="#F0EDE8" font-size="22" font-weight="600">Nouveau rendez-vous</text>
    <text x="32" y="184" fill="#C4BFDA" font-size="14">Un nouveau rendez-vous vient d'être pris sur votre site :</text>

    <!-- Detail rows -->
    <g font-size="13">
      <g transform="translate(32, 212)">
        <rect width="536" height="40" rx="6" fill="#1A1724"/>
        <text x="20" y="25" fill="#9590A8" font-size="12">Date / Heure</text>
        <text x="516" y="25" fill="#A899D4" font-weight="500" text-anchor="end">12/06/2026 · 10:00 (30 min)</text>
      </g>
      <g transform="translate(32, 260)">
        <rect width="536" height="40" rx="6" fill="#1A1724"/>
        <text x="20" y="25" fill="#9590A8" font-size="12">Prénom · Nom</text>
        <text x="516" y="25" fill="#A899D4" font-weight="500" text-anchor="end">Sophie Martin</text>
      </g>
      <g transform="translate(32, 308)">
        <rect width="536" height="40" rx="6" fill="#1A1724"/>
        <text x="20" y="25" fill="#9590A8" font-size="12">Email</text>
        <text x="516" y="25" fill="#9B8EC4" font-weight="500" text-anchor="end" text-decoration="underline">sophie@example.com</text>
      </g>
      <g transform="translate(32, 356)">
        <rect width="536" height="40" rx="6" fill="#1A1724"/>
        <text x="20" y="25" fill="#9590A8" font-size="12">Société</text>
        <text x="516" y="25" fill="#A899D4" font-weight="500" text-anchor="end">Acme Studio</text>
      </g>
      <g transform="translate(32, 404)">
        <rect width="536" height="40" rx="6" fill="#1A1724"/>
        <text x="20" y="25" fill="#9590A8" font-size="12">Téléphone</text>
        <text x="516" y="25" fill="#A899D4" font-weight="500" text-anchor="end">+33 6 12 34 56 78</text>
      </g>
    </g>

    <!-- Message block -->
    <text x="32" y="476" fill="#9590A8" font-size="11" letter-spacing="1.2">MESSAGE DU CLIENT</text>
    <g transform="translate(32, 488)">
      <rect width="536" height="108" rx="8" fill="#221D32"/>
      <text x="20" y="32" fill="#C4BFDA" font-size="13">Bonjour, j'aimerais discuter de la refonte de notre</text>
      <text x="20" y="52" fill="#C4BFDA" font-size="13">site et de la stratégie SEO pour le Q3.</text>
      <text x="20" y="84" fill="#C4BFDA" font-size="13">Disponible aussi en visio si besoin.</text>
    </g>

    <text x="32" y="630" fill="#9590A8" font-size="12">Gérer ce rendez-vous depuis le tableau de bord :</text>
    <text x="32" y="650" fill="#9B8EC4" font-size="13" font-weight="500" text-decoration="underline">https://monsite.fr/wp-admin/admin.php?page=ws-scheduler</text>

    <rect y="724" width="600" height="20" fill="#1A1724"/>
    <text x="300" y="738" fill="#6E6888" font-size="10" text-anchor="middle">Notification automatique — WS Scheduler</text>
  </g>

  <!-- Annotation -->
  <g transform="translate(60, 460)">
    <text class="lora" fill="#7C5CBF" font-size="16" font-weight="600">Notification admin</text>
    <text y="22" fill="#666" font-size="12">Reçue à l'adresse configurée</text>
    <text y="40" fill="#666" font-size="12">dans les réglages.</text>
    <text y="76" fill="#7C5CBF" font-size="12" font-weight="500">✓ Toutes les infos du client</text>
    <text y="96" fill="#7C5CBF" font-size="12" font-weight="500">✓ Message complet du client</text>
    <text y="116" fill="#7C5CBF" font-size="12" font-weight="500">✓ Lien direct vers le dashboard</text>
    <text y="136" fill="#7C5CBF" font-size="12" font-weight="500">✓ Email client en mailto cliquable</text>
  </g>
</svg>
